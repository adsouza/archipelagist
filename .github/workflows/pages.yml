name: Pages

# Builds the browser version and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # zig-pkg also holds the Emscripten SDK that raylib-zig installs on the
      # first web build, so a cached run skips that download.
      - uses: actions/cache@v6
        with:
          path: zig-pkg
          key: zig-pkg-web-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build for the web
        run: zig build -Dtarget=wasm32-emscripten -Doptimize=ReleaseSmall --summary all
      - uses: actions/upload-pages-artifact@v5
        with:
          path: zig-out/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
